<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seite nicht gefunden · Backinsel</title>
<meta name="robots" content="noindex">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:#120d0a;color:#fff6e4;
  display:grid;place-items:center;padding:24px;
}
.wrap{max-width:560px;text-align:center}
.eyebrow{font-size:.74rem;font-weight:850;letter-spacing:.22em;text-transform:uppercase;color:#f7d891;margin-bottom:.8rem}
h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(3rem,12vw,6rem);line-height:.9;letter-spacing:-.05em;margin-bottom:.6rem}
h1 span{display:block;font-style:italic;color:#f7d891}
p{font-size:1.05rem;line-height:1.55;color:rgba(255,247,232,.78);margin-bottom:1.6rem}
a.btn{
  display:inline-flex;align-items:center;justify-content:center;min-height:46px;border:1px solid #fff6e4;
  border-radius:999px;padding:.85rem 1.2rem;font-size:.78rem;font-weight:820;letter-spacing:.13em;text-transform:uppercase;
  background:#fff6e4;color:#120d0a;text-decoration:none;transition:transform .2s ease,opacity .2s ease;
}
a.btn:hover{transform:translateY(-2px);opacity:.92}
</style>
</head>
<body>
<main class="wrap">
  <p class="eyebrow">Backinsel · 404</p>
  <h1>Diese Seite<br><span>gibt's nicht.</span></h1>
  <p>Die Adresse ist nicht erreichbar — vielleicht eine alte Verlinkung. Zurück zur Backinsel-Startseite und einfach weiterstöbern.</p>
  <a class="btn" href="/">Zur Startseite</a>
</main>
</body>
</html>
